name: Sync FC2 to GitHub Clean JS Widget

on:
  schedule:
    - cron: '0 * * * *' # 1時間ごとに最新のお天気データを取得
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch FC2 Page Content
        id: fetch_fc2
        run: |
          URL="https://himithunosupeku.web.fc2.com/miniapps/sample/Weather/RETRO_WEATHER.html"
          HTML_CONTENT=$(curl -sL "$URL")
          
          if [ -z "$HTML_CONTENT" ]; then
            echo "Error: Failed to fetch FC2 content"
            exit 1
          fi

          # 広告スクリプトの除去
          CLEANED_HTML=$(echo "$HTML_CONTENT" | sed '/<script/,/<\/script>/d')
          
          # widget.js を直接埋め込み形式で生成
          cat << 'EOF' > widget.js
          (function() {
            var container = document.getElementById('retro-weather-container') || document.currentScript.parentNode;
            
            var iframe = document.createElement('iframe');
            iframe.style.width = '100%';
            iframe.style.height = '480px';
            iframe.style.border = 'none';
            iframe.style.outline = 'none';
            iframe.style.overflow = 'hidden';
            iframe.scrolling = 'no';
            
            container.appendChild(iframe);

            var doc = iframe.contentWindow.document;
            doc.open();
            doc.write(`
          EOF

          echo "$CLEANED_HTML" >> widget.js

          cat << 'EOF' >> widget.js
            `);
            doc.close();
          })();
          EOF

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add widget.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update bundled widget.js with full payload" && git push)
