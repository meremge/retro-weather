name: Sync FC2 to GitHub Clean JS Widget

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Bundle FC2 Widget
        run: |
          # 1. FC2のメインHTMLを取得
          HTML_CONTENT=$(curl -sL "https://himithunosupeku.web.fc2.com/miniapps/sample/Weather/RETRO_WEATHER.html")
          
          # 2. FC2の広告スクリプトを除去
          CLEANED_HTML=$(echo "$HTML_CONTENT" | sed '/<script/,/<\/script>/d')

          # 3. 依存する外部JS（お天気データの処理ロジック）をボットが直接ダウンロード
          JS_CONTENT=$(curl -sL "https://himithunosupeku.web.fc2.com/miniapps/sample/Weather/retro_weather.js" || echo "")

          # 4. HTMLとJSを完全に1つの独立した widget.js に完全統合
          cat << 'EOF' > widget.js
          (function() {
            var container = document.getElementById('retro-weather-container') || document.currentScript.parentNode;
            
            // HTML要素を直接注入（iframeなし）
            var wrapper = document.createElement('div');
            wrapper.className = 'retro-weather-wrapper';
            wrapper.innerHTML = `
          EOF

          echo "$CLEANED_HTML" >> widget.js

          cat << 'EOF' >> widget.js
            `;
            container.appendChild(wrapper);

            // ボットが取ってきたお天気JSプログラムをその場で直接実行
          EOF

          echo "$JS_CONTENT" >> widget.js

          cat << 'EOF' >> widget.js
          })();
          EOF

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add widget.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Bundle full JS logic directly into widget.js" && git push)
