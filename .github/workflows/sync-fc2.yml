name: Sync FC2 to GitHub Clean JS Widget

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch FC2 HTML and Build JS Widget
        run: |
          URL="https://himithunosupeku.web.fc2.com/miniapps/sample/Weather/RETRO_WEATHER.html"
          HTML_CONTENT=$(curl -sL "$URL")
          
          if [ -z "$HTML_CONTENT" ]; then
            echo "Error: Failed to fetch FC2 content"
            exit 1
          fi

          # FC2の自動挿入広告スクリプトを除去
          CLEANED_HTML=$(echo "$HTML_CONTENT" | sed '/<script/,/<\/script>/d')

          # widget.js を生成
          cat << 'EOF' > widget.js
          (function() {
            var container = document.getElementById('retro-weather-container') || document.currentScript.parentNode;
            var wrapper = document.createElement('div');
            wrapper.className = 'retro-weather-wrapper';
            wrapper.innerHTML = `
          EOF

          echo "$CLEANED_HTML" >> widget.js

          cat << 'EOF' >> widget.js
            `;
            container.appendChild(wrapper);

            // スクリプトタグを抽出し、少し遅延させて確実に即時実行させる
            setTimeout(function() {
              var scripts = wrapper.getElementsByTagName('script');
              for (var i = 0; i < scripts.length; i++) {
                var newScript = document.createElement('script');
                if (scripts[i].src) {
                  newScript.src = scripts[i].src;
                } else {
                  newScript.textContent = scripts[i].textContent;
                }
                document.body.appendChild(newScript);
              }
            }, 100);
          })();
          EOF

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add widget.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Fix JS execution delay in widget.js" && git push)
