name: Sync FC2 to GitHub Clean JS Widget

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Bundle FC2 Widget safely
        run: |
          # 1. HTMLとJSを取得
          HTML_CONTENT=$(curl -sL "https://himithunosupeku.web.fc2.com/miniapps/sample/Weather/RETRO_WEATHER.html")
          JS_CONTENT=$(curl -sL "https://himithunosupeku.web.fc2.com/miniapps/sample/Weather/weather.js")

          # 2. 広告を消してBase64に変換（記号のぶつかり・構文エラーを100%防止）
          CLEANED_HTML=$(echo "$HTML_CONTENT" | sed '/<script/,/<\/script>/d')
          HTML_B64=$(echo "$CLEANED_HTML" | base64 -w 0)
          JS_B64=$(echo "$JS_CONTENT" | base64 -w 0)

          # 3. 確実な widget.js を生成
          cat << EOF > widget.js
          (function() {
            var container = document.getElementById('retro-weather-container') || document.currentScript.parentNode;
            
            var iframe = document.createElement('iframe');
            iframe.style.cssText = 'width:100%; height:480px; border:none; outline:none; overflow:hidden;';
            iframe.scrolling = 'no';
            container.appendChild(iframe);

            var doc = iframe.contentWindow.document;
            doc.open();
            
            // 安全に復元してHTMLを書き込み
            var htmlString = decodeURIComponent(escape(atob('$HTML_B64')));
            doc.write(htmlString);

            // 安全に復元してJSを書き込み（ブラウザの通信ブロックを完全回避）
            var script = doc.createElement('script');
            var jsString = decodeURIComponent(escape(atob('$JS_B64')));
            script.textContent = jsString;
            doc.body.appendChild(script);

            doc.close();
          })();
          EOF

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add widget.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Bundle safely with Base64 encoding" && git push)
