name: Sync FC2 to GitHub Clean Page

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch FC2 HTML and Clean Ads
        run: |
          # 1. FC2からHTMLを取得
          URL="https://himithunosupeku.web.fc2.com/miniapps/sample/Weather/RETRO_WEATHER.html"
          HTML_CONTENT=$(curl -sL "$URL")
          
          if [ -z "$HTML_CONTENT" ]; then
            echo "Error: Failed to fetch FC2 content"
            exit 1
          fi

          # 2. FC2の自動挿入広告（<script>...</script>）を完全除去して index.html として保存
          echo "$HTML_CONTENT" | sed '/<script/,/<\/script>/d' > index.html

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Clean FC2 ads and export index.html" && git push)
