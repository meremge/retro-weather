name: Auto Build & Deploy Weather Widget

on:
  push:
    paths:
      - 'RETRO_WEATHER.html' # HTMLが変更・プッシュされた時のみ起動

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Build Script
        run: node build.js

      - name: Commit and Push Generated Widget
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add widget.js
          git commit -m "Auto build: Update widget.js from RETRO_WEATHER.html" || echo "No changes to commit"
          git push
