name: Auto Build & Deploy Weather Widget

on:
  push:
    paths:
      - 'RETRO_WEATHER.html'
      - 'build.js'

# 同時実行が発生した際、古い処理を自動キャンセルして1つだけ動かす設定
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # ワークフローにGitへの書き込み権限を与える
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 最新のGit履歴を確実に取得

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Build Script
        run: node build.js

      - name: Commit and Push Generated Widget
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add widget.js weather_widget.js
          
          # 変更がある場合のみコミット
          if ! git diff --staged --quiet; then
            git commit -m "Auto build: Update widget scripts"
            git pull --rebase origin ${{ github.ref_name }} # 競合を安全に自動解決
            git push origin ${{ github.ref_name }}
          else
            echo "No changes detected in widget scripts."
          fi
